<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <title>Get in touch · UxMikko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Inter:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="page">

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/img/logo.svg" alt="" style="height: 52px; width: auto;">
        UxMikko
      </a>
      <div class="nav-links">
        <a href="../" class="nav-back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </a>
      </div>
    </div>
  </nav>

  <div class="contact-wrap">
    <div class="contact-card">

      <div class="contact-intro">
        <h1 class="contact-heading">Let's talk.</h1>
        <p class="contact-sub">Open to senior and staff product design roles globally. Also happy to chat about work, collaboration, or anything in the UX space.</p>
        <div class="contact-links">
          <a class="contact-link" href="mailto:UxMikko@gmail.com">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.25"/><path d="M2 5.5l6 4 6-4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
            UxMikko@gmail.com
          </a>
          <a class="contact-link" href="https://linkedin.com/in/UxMikko" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.25"/><path d="M5 7v4M5 5v.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><path d="M8 11V8.5C8 7.67 8.67 7 9.5 7S11 7.67 11 8.5V11" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
            linkedin.com/in/UxMikko
          </a>
        </div>
      </div>

      <form class="contact-form" id="contact-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input class="form-input" id="name" type="text" name="name" placeholder="Your name">
            <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" id="email" type="email" name="email" placeholder="your@email.com">
            <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-textarea" id="message" name="message" placeholder="What's on your mind?"></textarea>
            <span class="form-error"></span>
        </div>
        <button class="form-submit" type="submit">Send message</button>
          <span class="form-error form-submit-error"></span>
      </form>

    </div>
  </div>

</div>

<div id="toast" style="
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #D6EAC0; border: 1px solid #9dc86e; color: #27500A;
  padding: 14px 20px; border-radius: 14px;
  display: flex; align-items: center; gap: 12px;
  font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
  opacity: 0; transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
  pointer-events: none; z-index: 999;
">
  <span style="width:20px;height:20px;background:#3A6B12;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 5.5l2.5 2.5 4.5-4.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  <span>
    Message sent — thank you!
    <span style="display:block;font-size:13px;font-weight:400;color:#3B6D11;margin-top:2px;">I'll get back to you soon.</span>
  </span>
</div>

<script>
(function () {
  function checkName(v)  { return v.trim() ? '' : 'Please enter your name.'; }
  function checkMsg(v)   { return v.trim() ? '' : 'Please enter a message.'; }
  function checkEmail(v) {
    v = v.trim();
    if (!v) return 'Please enter your email address.';
    var re = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    return re.test(v) ? '' : 'Please enter a valid email (e.g. you@example.com).';
  }

  function validate(el, checker) {
    var msg  = checker(el.value);
    var grp  = el.closest('.form-group');
    var span = grp ? grp.querySelector('.form-error') : null;
    el.classList.toggle('error', !!msg);
    if (span) span.textContent = msg;
    return !msg;
  }

  function attachListeners(form) {
    var fields = [
      { id: '#name',    check: checkName  },
      { id: '#email',   check: checkEmail },
      { id: '#message', check: checkMsg   },
    ];
    fields.forEach(function(f) {
      var el = form.querySelector(f.id);
      if (!el) return;
      el.addEventListener('blur',  function() { validate(el, f.check); });
      el.addEventListener('input', function() { if (el.classList.contains('error')) validate(el, f.check); });
    });
  }

  var form = document.getElementById('contact-form');
  if (form) attachListeners(form);

  window.handleSubmit = async function (e) {
    e.preventDefault();
    var form      = e.target;
    var nameEl    = form.querySelector('#name');
    var emailEl   = form.querySelector('#email');
    var msgEl     = form.querySelector('#message');
    var submitErr = form.querySelector('.form-submit-error');

    var ok = [
      validate(nameEl,  checkName),
      validate(emailEl, checkEmail),
      validate(msgEl,   checkMsg),
    ].every(Boolean);
    if (!ok) return;

    var btn = form.querySelector('.form-submit');
    if (submitErr) submitErr.textContent = '';
    btn.textContent = 'Sending…';
    btn.disabled    = true;

    try {
      var res = await fetch('https://formspree.io/f/xykngwry', {
        method:  'POST',
        body:    new FormData(form),
        headers: { 'Accept': 'application/json' },
      });
      if (!res.ok) throw new Error();
      form.reset();
      form.querySelectorAll('.form-error').forEach(function(s) { s.textContent = ''; });
      form.querySelectorAll('.error').forEach(function(el) { el.classList.remove('error'); });
      showToast();
    } catch(err) {
      if (submitErr) submitErr.textContent = 'Something went wrong — please email me directly.';
    } finally {
      btn.textContent = 'Send message';
      btn.disabled    = false;
    }
  };

  function showToast() {
    var t = document.getElementById('toast');
    if (!t) return;
    t.style.opacity   = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(function() {
      t.style.opacity   = '0';
      t.style.transform = 'translateX(-50%) translateY(80px)';
    }, 4000);
  }
})();
</script>
</body>
</html>
